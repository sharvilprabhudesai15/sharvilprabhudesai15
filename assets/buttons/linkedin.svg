<rect x="0.75" y="0.75" width="278.5" height="62.5" rx="32" fill="none" stroke="url(#edge)" stroke-opacity="0.55" stroke-width="1.5"/>
<text x="140.0" y="40" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="17" font-weight="700" letter-spacing="3" fill="#F1F5F9"><tspan fill="#60A5FA">in</tspan>  LINKEDIN</text>

<rect x="0.75" y="0.75" width="278.5" height="62.5" rx="32" fill="none" stroke="#60A5FA" stroke-width="2.5"
