<svg xmlns="http://www.w3.org/2000/svg" width="280" height="64" viewBox="0 0 280 64" role="img" aria-label="LINKEDIN">
<title>LINKEDIN</title>

<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#0B1024"/><stop offset="1" stop-color="#05070F"/>
  </linearGradient>
  <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#60A5FA"/><stop offset="1" stop-color="#A78BFA"/>
  </linearGradient>
  <radialGradient id="halo" cx="0.85" cy="0" r="0.8">
