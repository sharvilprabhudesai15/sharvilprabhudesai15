<text x="30" y="128" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" fill="#9FB0C8">Offline Codex analytics with traceable usage,</text><text x="30" y="153" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" fill="#9FB0C8">validation evidence and memory for next session.</text>
