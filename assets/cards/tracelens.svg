<svg xmlns="http://www.w3.org/2000/svg" width="500" height="300" viewBox="0 0 500 300" role="img" aria-label="TraceLens: Offline Codex analytics with traceable usage, validation evidence and memory for next session.">
<title>TraceLens: Offline Codex analytics with traceable usage, validation evidence and memory for next session.</title>

<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#0B1024"/><stop offset="1" stop-color="#05070F"/>
  </linearGradient>
  <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#A3E635"/><stop offset="1" stop-color="#22D3EE"/>
  </linearGradient>
  <radialGradient id="halo" cx="0.85" cy="0" r="0.8">
    <stop offset="0" stop-color="#A3E635" stop-opacity="0.28"/><stop offset="1" stop-color="#A3E635" stop-opacity="0"/>
  </radialGradient>
  <pattern id="grid" width="22" height="22" patternUnits="userSpaceOnUse">
    <path d="M22 0H0V22" fill="none" stroke="#FFFFFF" stroke-opacity="0.035"/>
  </pattern>
  <clipPath id="clip"><rect width="500" height="300" rx="20"/></clipPath>
</defs>
<g clip-path="url(#clip)">
  <rect width="500" height="300" fill="url(#bg)"/>
  <rect width="500" height="300" fill="url(#grid)"/>
  <rect width="500" height="300" fill="url(#halo)"/>
</g>
<rect x="0.75" y="0.75" width="498.5" height="298.5" rx="20" fill="none" stroke="url(#edge)" stroke-opacity="0.55" stroke-width="1.5"/>
<text x="30" y="44" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.5" letter-spacing="1.8" fill="#A3E635">04 // DEVELOPER ANALYTICS</text>
