<svg xmlns="http://www.w3.org/2000/svg" width="500" height="300" viewBox="0 0 500 300" role="img" aria-label="IdeaJoust: One rough idea in, competing approaches out — ranked in a pairwise tournament, then attacked.">
<title>IdeaJoust: One rough idea in, competing approaches out — ranked in a pairwise tournament, then attacked.</title>

<defs>
