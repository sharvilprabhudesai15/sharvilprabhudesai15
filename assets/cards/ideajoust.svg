<text x="30" y="128" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" fill="#9FB0C8">One rough idea in, competing approaches out —</text><text x="30" y="153" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" fill="#9FB0C8">ranked in a pairwise tournament, then attacked.</text>
