<svg xmlns="http://www.w3.org/2000/svg" width="500" height="300" viewBox="0 0 500 300" role="img" aria-label="Price Insights: Cross-retailer search, price tracking and hybrid recommendations across Amazon, Croma &amp; Reliance.">
<title>Price Insights: Cross-retailer search, price tracking and hybrid recommendations across Amazon, Croma &amp; Reliance.</title>

<defs>
