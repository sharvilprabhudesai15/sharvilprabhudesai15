<svg xmlns="http://www.w3.org/2000/svg" width="500" height="300" viewBox="0 0 500 300" role="img" aria-label="ChargeAtlas NSW: Links NSW EV chargers to ABS regions, Open Charge Map and OSM — with evidence for every match.">
<title>ChargeAtlas NSW: Links NSW EV chargers to ABS regions, Open Charge Map and OSM — with evidence for every match.</title>

<defs>
