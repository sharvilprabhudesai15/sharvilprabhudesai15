<svg xmlns="http://www.w3.org/2000/svg" width="400" height="220" viewBox="0 0 400 220" role="img" aria-label="OS Algorithms: 27 c programs">
<title>OS Algorithms: 27 c programs</title>

<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#0B1024"/><stop offset="1" stop-color="#05070F"/>
  </linearGradient>
  <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#F472B6"/><stop offset="1" stop-color="#A78BFA"/>
  </linearGradient>
  <radialGradient id="halo" cx="0.85" cy="0" r="0.8">
    <stop offset="0" stop-color="#F472B6" stop-opacity="0.28"/><stop offset="1" stop-color="#F472B6" stop-opacity="0"/>
  </radialGradient>
  <pattern id="grid" width="22" height="22" patternUnits="userSpaceOnUse">
    <path d="M22 0H0V22" fill="none" stroke="#FFFFFF" stroke-opacity="0.035"/>
  </pattern>
  <clipPath id="clip"><rect width="400" height="220" rx="18"/></clipPath>
</defs>
<g clip-path="url(#clip)">
  <rect width="400" height="220" fill="url(#bg)"/>
  <rect width="400" height="220" fill="url(#grid)"/>
  <rect width="400" height="220" fill="url(#halo)"/>
</g>
<rect x="0.75" y="0.75" width="398.5" height="218.5" rx="18" fill="none" stroke="url(#edge)" stroke-opacity="0.55" stroke-width="1.5"/>
<text x="26" y="40" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" letter-spacing="1.8" fill="#F472B6">LAB // C · POSIX</text>
<text x="374" y="40" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" fill="#64748B">SOURCE ↗</text>
<text x="26" y="80" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="23" font-weight="700" fill="#F1F5F9">OS Algorithms</text>
<text x="26" y="146" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="50" font-weight="800" fill="#F472B6">27</text>
<text x="98" y="128" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.5" letter-spacing="1.4" fill="#9FB0C8">C</text>
<text x="98" y="146" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.5" letter-spacing="1.4" fill="#9FB0C8">PROGRAMS</text>
<line x1="26" x2="374" y1="168" y2="168" stroke="#F472B6" stroke-opacity="0.25" stroke-dasharray="3 5"/>
<text x="26" y="195" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.5" fill="#64748B">scheduling · paging · deadlock · fork()</text>

<rect x="0.75" y="0.75" width="398.5" height="218.5" rx="18" fill="none" stroke="#F472B6" stroke-width="2.5"
      stroke-linecap="round" stroke-dasharray="90 1240" opacity="0.9">
  <animate attributeName="stroke-dashoffset" from="0" to="-1330" dur="8s" repeatCount="indefinite"/>
</rect>
